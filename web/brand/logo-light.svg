<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" height="40" fill="none" aria-label="Cat's Eye">
  <defs>
    <linearGradient id="ce_amber_light_grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <g transform="translate(2, 2)">
    <!-- Gemstone Contour -->
    <path d="M18 2 C7 2 1 18 1 18 C1 18 7 34 18 34 C29 34 35 18 35 18 C35 18 29 2 18 2 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M18 5 C10 5 5 18 5 18 C5 18 10 31 18 31 C26 31 31 18 31 18 C31 18 26 5 18 5 Z" fill="url(#ce_amber_light_grad)" opacity="0.95"/>
    <!-- Vertical Slit Pupil -->
    <path d="M18 6 C15.8 12 15.2 18 15.2 18 C15.2 18 15.8 24 18 30 C20.2 24 20.8 18 20.8 18 C20.8 18 20.2 12 18 6 Z" fill="#0F172A"/>
    <line x1="18" y1="7" x2="18" y2="29" stroke="#FEF3C7" stroke-width="0.8" opacity="0.8"/>
    <circle cx="16.5" cy="12" r="1.5" fill="#FFFFFF" opacity="0.95"/>
    <!-- Precision Calibration Ticks -->
    <line x1="18" y1="0" x2="18" y2="3" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="33" x2="18" y2="36" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark in Dark Slate for Light Mode -->
  <text x="46" y="27" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5px" fill="#0F172A">Cat's Eye</text>
  <rect x="144" y="14" width="48" height="17" rx="3.5" fill="rgba(217,119,6,0.12)" stroke="rgba(217,119,6,0.3)" stroke-width="0.8"/>
  <text x="151" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1px" fill="#D97706">STUDIO</text>
</svg>
