<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" height="40" fill="none" aria-label="Cat's Eye">
  <defs>
    <linearGradient id="ce_amber_grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Gemstone Contour & Iris -->
  <g transform="translate(2, 2)">
    <!-- Almond Gemstone Contour -->
    <path d="M18 2 C7 2 1 18 1 18 C1 18 7 34 18 34 C29 34 35 18 35 18 C35 18 29 2 18 2 Z" fill="#13151D" stroke="#2B3142" stroke-width="1.5"/>
    <path d="M18 5 C10 5 5 18 5 18 C5 18 10 31 18 31 C26 31 31 18 31 18 C31 18 26 5 18 5 Z" fill="url(#ce_amber_grad)" opacity="0.95"/>
    <ellipse cx="18" cy="18" rx="8" ry="12" fill="#78350F" opacity="0.45"/>
    <!-- Vertical Slit Pupil -->
    <path d="M18 6 C15.8 12 15.2 18 15.2 18 C15.2 18 15.8 24 18 30 C20.2 24 20.8 18 20.8 18 C20.8 18 20.2 12 18 6 Z" fill="#0A0B0E"/>
    <line x1="18" y1="7" x2="18" y2="29" stroke="#FEF3C7" stroke-width="0.8" opacity="0.8"/>
    <circle cx="16.5" cy="12" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- Precision Calibration Ticks -->
    <line x1="18" y1="0" x2="18" y2="3" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="33" x2="18" y2="36" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="46" y="27" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5px" fill="#F8FAFC">Cat's Eye</text>
  <rect x="144" y="14" width="48" height="17" rx="3.5" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="0.8"/>
  <text x="151" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1px" fill="#F59E0B">STUDIO</text>
</svg>
