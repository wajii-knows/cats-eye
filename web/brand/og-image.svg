<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og_bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0B0E"/>
      <stop offset="60%" stop-color="#13151D"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="og_iris" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="og_ray" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.05)"/>
      <stop offset="50%" stop-color="rgba(245, 158, 11, 0.15)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og_bg)"/>

  <!-- Subtle Slit Light Sweep Background -->
  <rect x="580" y="0" width="40" height="630" fill="url(#og_ray)"/>

  <!-- Logo Mark -->
  <g transform="translate(140, 195) scale(2.8)">
    <path d="M18 2 C7 2 1 18 1 18 C1 18 7 34 18 34 C29 34 35 18 35 18 C35 18 29 2 18 2 Z" fill="#13151D" stroke="#2B3142" stroke-width="1.5"/>
    <path d="M18 5 C10 5 5 18 5 18 C5 18 10 31 18 31 C26 31 31 18 31 18 C31 18 26 5 18 5 Z" fill="url(#og_iris)"/>
    <ellipse cx="18" cy="18" rx="8" ry="12" fill="#78350F" opacity="0.45"/>
    <!-- Vertical Slit Pupil -->
    <path d="M18 6 C15.8 12 15.2 18 15.2 18 C15.2 18 15.8 24 18 30 C20.2 24 20.8 18 20.8 18 C20.8 18 20.2 12 18 6 Z" fill="#0A0B0E"/>
    <line x1="18" y1="7" x2="18" y2="29" stroke="#FEF3C7" stroke-width="0.8" opacity="0.8"/>
    <circle cx="16.5" cy="12" r="1.5" fill="#FFFFFF" opacity="0.95"/>
    <!-- Ticks -->
    <line x1="18" y1="0" x2="18" y2="3" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="33" x2="18" y2="36" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="280" y="260" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-2px">Cat's Eye</text>
  <rect x="660" y="200" width="120" height="42" rx="8" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <text x="686" y="229" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" letter-spacing="2px" fill="#F59E0B">STUDIO</text>

  <!-- Slogan -->
  <text x="140" y="360" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#F59E0B" letter-spacing="-0.5px">Spot the moment worth keeping.</text>
  <text x="140" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94A3B8" letter-spacing="0px">AI Video Intelligence for High-Velocity 9:16 Short-Form Production</text>

  <!-- Feature Pills -->
  <g transform="translate(140, 480)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="#1B1E29" stroke="#2B3142" stroke-width="1"/>
    <text x="24" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">AI Moment Scoring</text>

    <rect x="236" y="0" width="210" height="44" rx="22" fill="#1B1E29" stroke="#2B3142" stroke-width="1"/>
    <text x="260" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Dynamic Multishot</text>

    <rect x="462" y="0" width="200" height="44" rx="22" fill="#1B1E29" stroke="#2B3142" stroke-width="1"/>
    <text x="486" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Animated Subtitles</text>

    <rect x="678" y="0" width="220" height="44" rx="22" fill="#1B1E29" stroke="#2B3142" stroke-width="1"/>
    <text x="702" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Zero External APIs</text>
  </g>
</svg>
